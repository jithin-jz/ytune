[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ytune"
version = "0.1.0"
description = "A full-screen terminal music player for YouTube, built on yt-dlp and mpv."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "jithin-jz" }]
keywords = ["music", "youtube", "tui", "terminal", "mpv", "yt-dlp"]
dependencies = [
    "textual>=8.2",
    "yt-dlp[default]>=2026.10.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ytune = "ytune.cli:main"

[project.urls]
Homepage = "https://github.com/jithin-jz/ytune"

[tool.hatch.build.targets.wheel]
packages = ["src/ytune"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
